name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

# Run comprehensive tests on all platforms to catch platform-specific issues
# Downloads GMFT test data to enable complete test suite including gmft_data tests
# Coverage is only uploaded from Ubuntu Python 3.11 to avoid conflicts

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"
    
    - name: Install dependencies
      run: |
        uv sync --extra dev --extra test
    
    - name: Download GMFT test data
      run: |
        make download-data
    
    - name: Run comprehensive tests with coverage (all platforms)
      run: |
        echo "=== Starting Test Run for ${{ matrix.os }} Python ${{ matrix.python-version }} ==="
        make ci-coverage 2>&1 | tee test_output.log
        echo "=== Test Run Complete ==="
    
    - name: Report test summary and skips
      if: always()
      run: |
        echo ""
        echo "=== TEST SUMMARY for ${{ matrix.os }} Python ${{ matrix.python-version }} ==="
        echo "=================================================================="
        # Extract the final test result line
        grep -E "=+ .* (passed|failed|skipped|error)" test_output.log | tail -1 || echo "Could not parse test results"
        echo ""
        # Show any skipped tests with reasons
        echo "Skip Analysis:"
        grep -E "SKIP|PASSED.*\[.*%\]|FAILED.*\[.*%\]" test_output.log | grep "SKIP" || echo "✓ No tests were skipped"
        echo "=================================================================="
    
    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false