[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
markers =
    integration: marks tests as integration tests (deselect with '-m "not integration"')
    slow: marks tests as slow (deselect with '-m "not slow"')
    requires_gmft: marks tests that require actual GMFT installation
    gmft_data: marks tests that use GMFT's test data (requires gmft source)
    validation: marks tests that validate against GMFT's expected behavior